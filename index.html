```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b26">
  <title>Flowers for You</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      position: relative;
      background: linear-gradient(
        #090b26,
        #24204b,
        #102c2a
      );
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 15% 20%, white, transparent),
        radial-gradient(1px 1px at 35% 10%, white, transparent),
        radial-gradient(2px 2px at 75% 15%, white, transparent),
        radial-gradient(1px 1px at 90% 40%, white, transparent),
        radial-gradient(2px 2px at 55% 30%, white, transparent),
        radial-gradient(1px 1px at 25% 45%, white, transparent);
      animation: twinkle 3s infinite alternate;
    }

    h1 {
      position: absolute;
      z-index: 3;
      top: 10%;
      width: 100%;
      padding: 0 15px;
      text-align: center;
      font-family: Georgia, serif;
      font-size: clamp(22px, 6vw, 34px);
      font-weight: normal;
      color: #ffe9fa;
      text-shadow: 0 0 20px #e8a9ff;
      animation: appear 2s both;
    }

    .garden {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
      height: 72vh;
      height: 72dvh;
      display: flex;
      justify-content: space-evenly;
      align-items: flex-end;
    }

    .flower {
      position: relative;
      width: 33%;
      height: var(--height);
      transform-origin: bottom center;
      animation: sway 4s ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .stem {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 7px;
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(
        90deg,
        #12502f,
        #47a65a,
        #16452c
      );
      transform: scaleY(0);
      transform-origin: bottom;
      animation: grow 2s ease-out forwards;
      animation-delay: var(--delay);
    }

    .leaf {
      position: absolute;
      width: 42px;
      height: 22px;
      background: linear-gradient(
        135deg,
        #4bb65d,
        #14522e
      );
      border-radius: 100% 0 100% 0;
    }

    .leaf.left {
      left: 3px;
      top: 45%;
      transform: rotate(15deg);
    }

    .leaf.right {
      right: 2px;
      top: 65%;
      transform: scaleX(-1) rotate(15deg);
    }

    .head {
      position: absolute;
      top: -5px;
      left: 50%;
      width: 110px;
      height: 110px;
      transform: translateX(-50%) scale(0);
      animation: bloom 1.4s ease-out forwards;
      animation-delay: calc(var(--delay) + 1.4s);
    }

    .petal {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 42px;
      height: 58px;
      border-radius: 50% 50% 45% 45%;
      transform-origin: 50% 100%;
      background: linear-gradient(
        160deg,
        var(--light),
        var(--color),
        var(--dark)
      );
      box-shadow:
        inset -4px -5px 8px #00000018,
        0 0 10px #ffffff20;
    }

    .petal:nth-child(1) {
      transform: translate(-50%, -100%) rotate(0deg);
    }

    .petal:nth-child(2) {
      transform: translate(-50%, -100%) rotate(45deg);
    }

    .petal:nth-child(3) {
      transform: translate(-50%, -100%) rotate(90deg);
    }

    .petal:nth-child(4) {
      transform: translate(-50%, -100%) rotate(135deg);
    }

    .petal:nth-child(5) {
      transform: translate(-50%, -100%) rotate(180deg);
    }

    .petal:nth-child(6) {
      transform: translate(-50%, -100%) rotate(225deg);
    }

    .petal:nth-child(7) {
      transform: translate(-50%, -100%) rotate(270deg);
    }

    .petal:nth-child(8) {
      transform: translate(-50%, -100%) rotate(315deg);
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        circle,
        #fff5b2,
        #ffc94e,
        #db8b2b
      );
      box-shadow: 0 0 18px #ffdf78;
    }

    .grass {
      position: absolute;
      z-index: 2;
      bottom: 0;
      width: 100%;
      height: 65px;
      background: linear-gradient(
        transparent,
        #071b18
      );
    }

    .grass::before,
    .grass::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 35px;
      height: 75px;
      background: linear-gradient(
        90deg,
        #164a2c,
        #36894b
      );
      border-radius: 100% 0 0 0;
    }

    .grass::before {
      left: 8%;
      transform: rotate(-15deg);
    }

    .grass::after {
      right: 8%;
      transform: scaleX(-1) rotate(-15deg);
    }

    @keyframes grow {
      to {
        transform: scaleY(1);
      }
    }

    @keyframes bloom {
      0% {
        transform: translateX(-50%) scale(0);
      }

      80% {
        transform: translateX(-50%) scale(1.08);
      }

      100% {
        transform: translateX(-50%) scale(1);
      }
    }

    @keyframes sway {
      0%, 100% {
        rotate: -2deg;
      }

      50% {
        rotate: 2deg;
      }
    }

    @keyframes twinkle {
      from {
        opacity: 0.55;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 380px) {
      .head {
        transform: translateX(-50%) scale(0);
      }

      .petal {
        width: 35px;
        height: 50px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .stars,
      h1,
      .flower,
      .stem,
      .head {
        animation-duration: 0.01ms;
        animation-iteration-count: 1;
      }

      .stem {
        transform: scaleY(1);
      }

      .head {
        transform: translateX(-50%) scale(1);
      }
    }
  </style>
</head>

<body>

  <h1>Flowers just for you ✨</h1>

      </div>
    </div>

    >

      <div class="head">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>

      "
    >
      <div class="stem">

      <div class="head">
        <div class="petal"></div>

        <div class="petal"></div>
        <div class="petal"></div>

      </div>
    </div>

  </main>

  <div class="grass"></div>
</body>
</html>
